services:
  # Telegram Bot (optional - for notifications only)
  # The API is handled by Cloudflare Workers (eza-worker/)
  # The frontend is handled by Cloudflare Pages (webapp/)
  - type: web
    name: eza-shop-bot
    env: node
    plan: free
    rootDir: bot
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: SUPERADMIN_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DB_POOL_MAX
        value: "12"
      - key: DB_POOL_MIN
        value: "2"
      # Optional — add Upstash later for faster cache (not required)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
