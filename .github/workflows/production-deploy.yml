name: MO-MO Production CI/CD 🚀

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security_and_build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          bot/package-lock.json
          webapp/package-lock.json

    - name: 🛡️ Backend Security Audit
      working-directory: ./bot
      run: |
        npm ci
        npm audit --audit-level=high

    - name: 🛡️ Frontend Security Audit & Build
      working-directory: ./webapp
      run: |
        npm ci
        npm audit --audit-level=critical
        npm run build
        # The build process automatically strips console logs via Vite config

    - name: 🚀 Deploy to Production Server
      if: github.ref == 'refs/heads/main'
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        echo "Deployment script triggered..."
        # Replace this with actual deployment commands (e.g., rsync, Docker, or PM2 restart)
        # Example:
        # rsync -avz --delete ./webapp/dist/ $SERVER_USER@$SERVER_IP:/var/www/momo-app/
        # ssh $SERVER_USER@$SERVER_IP "cd /opt/momo-bot && git pull && npm ci && pm2 restart bot"
