name: MO-MO Production CI/CD 🚀

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security_and_build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          bot/package-lock.json
          webapp/package-lock.json

    - name: 🛡️ Backend Security Audit
      working-directory: ./bot
      run: |
        npm ci
        npm audit --audit-level=high
        node --check server.js
        node --check app.js
        node --check scripts/migrate-all.js
        node --check scripts/smoke-test.js

    - name: 🧪 Shared Utils Tests
      run: npm test

    - name: 🛡️ Frontend Security Audit & Build
      working-directory: ./webapp
      run: |
        npm ci
        npm audit --audit-level=critical
        npm run build
        # The build process automatically strips console logs via Vite config

    - name: 🚀 Deploy to Production (Render)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Render auto-deploys on push to main (see render.yaml)."
        echo "Backend preDeployCommand runs: npm run migrate"
        echo "Manual check after deploy: cd bot && npm run smoke"
