name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'webapp/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-pages-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Cloudflare Pages
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Install Dependencies
        working-directory: ./webapp
        run: npm install

      - name: Build Application
        working-directory: ./webapp
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'https://vibe-lifestyle-api.koeurnseab630.workers.dev' }}
          VITE_BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME || 'Vibe_Lifestyle_bot' }}

      - name: Verify dist exists
        run: ls -la webapp/dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy webapp/dist --project-name=vibe-lifestyle-web --commit-dirty=true
