name = "eza-shop-api"
main = "src/index.ts"
compatibility_date = "2024-08-15"
node_compat = true

[vars]
NODE_ENV = "development"

[env.production]
name = "eza-shop-api-prod"
vars = { NODE_ENV = "production" }

[env.staging]
name = "eza-shop-api-staging"
vars = { NODE_ENV = "staging" }

# Secrets (set via CLI or dashboard)
# DATABASE_URL - Neon PostgreSQL connection string
# BOT_TOKEN - Telegram Bot Token
# CLOUDINARY_CLOUD_NAME - Image hosting
# CLOUDINARY_API_KEY - Image API key
# CLOUDINARY_API_SECRET - Image API secret
# SESSION_SECRET - JWT signing secret
# SUPERADMIN_ID - Admin user ID