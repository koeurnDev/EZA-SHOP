name = "vibe-lifestyle-api"
main = "src/index.ts"
compatibility_date = "2024-08-15"
compatibility_flags = ["nodejs_compat"]

[vars]
BOT_USERNAME = "Vibe_Lifestyle_bot"

[triggers]
crons = ["* * * * *"]

# Default environment (production)
# NODE_ENV not set = production mode (Telegram auth required)

[env.production]
name = "vibe-lifestyle-api-prod"
vars = { NODE_ENV = "production" }

[env.staging]
name = "vibe-lifestyle-api-staging"
vars = { NODE_ENV = "staging" }

# Secrets (set via CLI or dashboard)
# wrangler secret put DATABASE_URL
# wrangler secret put BOT_TOKEN
# wrangler secret put SUPERADMIN_ID
# wrangler secret put SESSION_SECRET
# wrangler secret put CLOUDINARY_CLOUD_NAME
# wrangler secret put CLOUDINARY_API_KEY
# wrangler secret put CLOUDINARY_API_SECRET
